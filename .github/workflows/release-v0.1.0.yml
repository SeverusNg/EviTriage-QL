name: Publish v0.1.0

on:
  push:
    tags:
      - v0.1.0

permissions:
  contents: write

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish v0.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --all-extras

      - name: Check tag and package version
        run: test "$GITHUB_REF_NAME" = "v$(uv run --offline python -c 'import evitriage; print(evitriage.__version__)')"

      - name: Run the complete quality and security gates
        run: |
          make check
          make security-test

      - name: Build and verify the closed release directory
        run: |
          make release-artifacts
          make release-verify

      - name: Reinstall and replay from the source distribution
        run: |
          clean_room="$(mktemp -d)"
          tar -xzf dist/release/0.1.0/evitriage_ql-0.1.0.tar.gz -C "$clean_room"
          cd "$clean_room/evitriage_ql-0.1.0"
          uv sync --all-extras --offline
          make check
          make security-test
          make demo

      - name: Create the GitHub release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_directory="dist/release/0.1.0"
          release_bundle="dist/evitriage-ql-0.1.0-release.tar.gz"
          tar -czf "$release_bundle" -C "$release_directory" .
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "EviTriage-QL $GITHUB_REF_NAME" \
            --notes-file docs/releases/v0.1.0.md \
            "$release_directory"/* \
            "$release_bundle"
